<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Chat AI Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(90vw, 520px);
        padding: 32px;
        border: 1px solid #1e293b;
        border-radius: 24px;
        background: #0f172a;
        box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0 0 24px;
        color: #94a3b8;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        padding: 12px 18px;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Chat AI cannot reach the internet right now. Reconnect to continue your
        conversation and receive AI responses.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
