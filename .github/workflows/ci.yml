name: CI

on:
  push:
    branches: [assignment-09]
  pull_request:
    branches: [assignment-09]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
