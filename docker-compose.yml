services:
  postgres:
    image: postgres:16
    container_name: chat_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_ai
      POSTGRES_USER: chat_ai_user
      POSTGRES_PASSWORD: chat_ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
